function gen(seed){const r=rng(seed),B=[],sc=['#ffe6a0','#ffc878','#c8dcff','#ff9064'][r()*4|0];
 B.push({name:nm(r)+' (star)',type:'star',R:260,GM:1.6e6,orbR:0,c1:sc,c2:'#fff',rho:0,H:1,spin:0,w:0,a0:0,par:-1});
 const n=4+(r()*4|0);let d=2600;
 for(let i=0;i<n;i++){d*=1.45+r()*.45;const ty=i==1?'ocean':['rock','desert','ice','ocean','lava','gas'][i==0?(r()<.5?4:1):r()*6|0];
  const gas=ty=='gas',R=gas?350+r()*200:90+r()*140,gr=gas?1.6:.5+r()*1.6,t=TY[ty];
  const b={name:nm(r),type:ty,R,GM:(ty=='ocean'&&i==1?1:gr)*R*R,orbR:d,c1:t[0],c2:t[1],atmc:t[2],rho:t[3],H:R*.09,spin:(r()-.5)*.02,a0:r()*6.28,par:0,ring:gas&&r()<.6,seed:r()*1e6|0};
  b.w=Math.sqrt(B[0].GM/d**3);B.push(b);const pi=B.length-1;
  if(!gas||r()<.5)for(let m=0,k=r()*3|0;m<k;m++){const mR=25+r()*45,mo=R*(3.5+m*2.2+r());

const ENG={chem:{T:60,isp:300,m:.5,cost:500,n:'Chemical'},ion:{T:8,isp:2500,m:.3,cost:1500,n:'Ion'},nuke:{T:40,isp:900,m:.8,cost:3000,n:'Nuclear'},fusion:{T:70,isp:4000,m:1.2,cost:9000,n:'Fusion'}};
const UP=[['thrust','Uprated nozzles: +15% thrust',10,[],'Chemical'],['chem2','Staged combustion: +10% thrust',15,['thrust'],'Chemical'],['isp','Advanced nozzles: +10% exhaust velocity',20,['chem2'],'Chemical'],

['ion','Unlock Ion engine',20,[],'Energy'],['solar','Solar arrays: +50% outpost income',30,[],'Energy'],

const sts=(k,ne,tk)=>{const e=ENG[k],o=S.own;return{fm:tk*4*(o.tanks?1.25:1)*(o.tanks2?1.25:1),dry:1+ne*e.m*(o.mat?.8:1)+tk*.4*(o.mat?.7:1),T:e.T*ne*(o.thrust?1.15:1)*(o.chem2?1.1:1),ve:e.isp*.06*(o.isp?1.1:1)}};

 if(s.landed!=null){const i=s.landed,b=B[i],a=s.sa+b.spin*(S.t+dt),nx=p2[i][0]+Math.cos(a)*b.R,ny=p2[i][1]+Math.sin(a)*b.R;s.vx=(nx-s.x)/dt;s.vy=(ny-s.y)/dt;s.x=nx;s.y=ny;

  for(let pq=0;pq<3;pq++)parts.push({x:s.x-Math.cos(s.ang)*EX,y:s.y-Math.sin(s.ang)*EX,vx:s.vx-Math.cos(s.ang)*22+(Math.random()-.5)*4,vy:s.vy-Math.sin(s.ang)*22+(Math.random()-.5)*4,l:.5,f:1})}

function dom(){const s=S.sh,p=P(S.t);let bi=0,bf=0;for(let i=0;i<B.length;i++){const d2=(p[i][0]-s.x)**2+(p[i][1]-s.y)**2+1,f=B[i].GM/d2;if(f>bf){bf=f;bi=i}}return bi}

// render
const stars=Array.from({length:240},()=>[Math.random(),Math.random(),Math.random()*1.4+.3]);
function sc(x,y,c){return[(x-c[0])*zoom+W/2,(y-c[1])*zoom+H/2]}
function draw(){const s=S.sh,p=P(S.t),cam=[s.x,s.y];g.fillStyle='#02030a';g.fillRect(0,0,W,H);
 for(const t of stars){g.fillStyle=`rgba(255,255,255,${.3+t[2]/2.5})`;g.fillRect(((t[0]*W-s.x*.01*t[2])%W+W)%W,((t[1]*H-s.y*.01*t[2])%H+H)%H,t[2],t[2])}
 for(let i=1;i<B.length;i++){const b=B[i],c=sc(p[b.par][0],p[b.par][1],cam);g.strokeStyle='rgba(80,160,220,.15)';g.beginPath();g.arc(c[0],c[1],b.orbR*zoom,0,7);g.stroke()}
 for(let i=0;i<B.length;i++){const b=B[i],[x,y]=sc(p[i][0],p[i][1],cam),r=Math.max(b.R*zoom,2.5);if(x<-r*3||x>W+r*3||y<-r*3||y>H+r*3)continue;
  if(b.type=='star'){const gr=g.createRadialGradient(x,y,r*.5,x,y,r*3);gr.addColorStop(0,b.c1);gr.addColorStop(.3,b.c1+'55');gr.addColorStop(1,'#0000');g.fillStyle=gr;g.beginPath();g.arc(x,y,r*3,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(x,y,r*.9,0,7);g.fill();continue}

  const ps=Math.atan2(y-(H/2-(s.y-0)*0),x-W/2);const sd=g.createLinearGradient(x,y,x+Math.cos(Math.atan2(p[i][1],p[i][0]))*r*2*-1,y+Math.sin(Math.atan2(p[i][1],p[i][0]))*r*2*-1);

 hud(p)}
function hud(p){const s=S.sh,i=dom(),b=B[i],o=orb(i),q=st(),d=Math.hypot(p[i][0]-s.x,p[i][1]-s.y),gv=b.GM/d**2,T=B[target],td=Math.hypot(p[target][0]-s.x,p[target][1]-s.y);
